name: simulator

# Runs the simulator's provisioning directly on GitHub runners, which play the desktop VM
# of simulator/lab.sh. Jobs run at the same time:
#   ui   the desktop (XFCE + noVNC + exam-sim) and the exam hosts of mock 1 (one kubeadm
#        cluster per host, Incus system containers), then a smoke test of the UI
#   e2e  one job per exam: builds the host of one of its questions (the "# e2e: <n>" line of
#        */mock-*/hosts.txt) and e2e-tests that question. Building the host already checks that
#        the environment works. Run the workflow by hand with "all questions" to test every
#        question instead (one job per host), the same tests as "exam-hostctl e2e <mock>".
on:
  push:
    paths:
      - 'simulator/**'
      - 'scripts/**'
      - 'cka/**'
      - 'tests/**'
      - '.github/workflows/simulator.yml'
  workflow_dispatch:
    inputs:
      all_questions:
        description: e2e of every question (one job per exam host) instead of one question per exam
        type: boolean
        default: false

concurrency:   # a newer push to a branch replaces the run of the older one
  group: simulator-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DPKG_UNSAFE_IO: 1   # throwaway runners: dpkg does not fsync every file
  EXAM_TRACE: 1       # trace of the node setup in the base build
  # the mirror the runners use themselves: archive.ubuntu.com sometimes stalls an apt-get update for 20+ minutes
  APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
  APT_CACHE_DIR: /var/cache/exam-apt   # packages apt downloaded, kept between runs (actions/cache)

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - working-directory: simulator
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          E2E_ALL: ${{ inputs.all_questions && '1' || '' }}
        run: |
          matrix=$(bash simulator/incus/exam-hosts.sh e2e-plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          { echo '## e2e jobs'; jq -r '.include[] | "- \(.mock) on \(.host): questions \(.questions)"' <<<"$matrix"; } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: plan
    name: e2e ${{ matrix.mock }} ${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash   # -eo pipefail
    env:
      HOSTCTL: sudo -E /usr/local/sbin/exam-hostctl
      EXAM_KEEP_RUNNING: all   # one host per runner: nothing to stop
    steps:
      - uses: actions/checkout@v4

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4   # saved at the end of a green job when the key is new
        id: apt
        with:
          path: ~/apt-cache
          key: apt-e2e-${{ hashFiles('simulator/provision/**', 'simulator/incus/**') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            apt-e2e-${{ hashFiles('simulator/provision/**', 'simulator/incus/**') }}-
            apt-e2e-

      - name: Prepare the runner
        run: simulator/ci/prepare-runner.sh

      - name: exam host ${{ matrix.host }} (Incus + its kubeadm cluster)
        run: |
          sudo bash /opt/k8s-exam-practice/simulator/incus/exam-hosts.sh install
          $HOSTCTL build "${{ matrix.mock }}" "${{ matrix.host }}"

      - name: Keep what apt downloaded for the next run
        if: steps.apt.outputs.cache-hit != 'true'
        run: simulator/ci/save-apt-cache.sh

      - run: simulator/ci/fsync-bench.sh

      - name: e2e (questions ${{ matrix.questions }})
        run: $HOSTCTL e2e "${{ matrix.mock }}" ${{ matrix.questions }}

      - name: Memory and node sizes
        if: always()
        run: |
          { echo '## ${{ matrix.mock }} ${{ matrix.host }}'; echo '```'; $HOSTCTL mem; $HOSTCTL nodes "${{ matrix.host }}"; df -h /; simulator/ci/fsync-bench.sh; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY" || true
          cat /tmp/apt-watchdog.log 2>/dev/null || true

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash   # -eo pipefail
    env:
      HOSTCTL: sudo -E /usr/local/sbin/exam-hostctl
    steps:
      - uses: actions/checkout@v4

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4   # saved at the end of a green job when the key is new
        id: apt
        with:
          path: ~/apt-cache
          key: apt-ui-${{ hashFiles('simulator/provision/**', 'simulator/incus/**') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            apt-ui-${{ hashFiles('simulator/provision/**', 'simulator/incus/**') }}-
            apt-ui-

      - name: Prepare the runner (it plays the desktop VM)
        run: simulator/ci/prepare-runner.sh

      - name: provision/desktop.sh
        run: |
          sudo bash /opt/k8s-exam-practice/simulator/provision/desktop.sh
          for _ in $(seq 20); do sudo test -s /home/candidate/.config/exam-sim/token && break; sleep 1; done
          echo "EXAM_URL=http://127.0.0.1:8080/login?t=$(sudo cat /home/candidate/.config/exam-sim/token)" >> "$GITHUB_ENV"

      - name: exam hosts of mock 1 (Incus + one kubeadm cluster per host)
        run: |
          simulator/ci/fsync-bench.sh
          sudo bash /opt/k8s-exam-practice/simulator/incus/exam-hosts.sh install
          $HOSTCTL build cka/mock-01 | tee /tmp/build.log
          { echo '## Exam hosts'; echo '```'; grep -E '^host .* ready in' /tmp/build.log; $HOSTCTL status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for h in $(awk '!/^#/ && NF {print $1}' cka/mock-01/hosts.txt | head -2); do
            sudo runuser -u candidate -- ssh -o BatchMode=yes "$h" kubectl get nodes
          done

      - name: Keep what apt downloaded for the next run
        if: steps.apt.outputs.cache-hit != 'true'
        run: simulator/ci/save-apt-cache.sh

      - name: UI smoke test
        run: |
          cd simulator/ci
          npm init -y >/dev/null
          if command -v google-chrome >/dev/null; then   # preinstalled: no browser download
            export PW_CHANNEL=chrome PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
            npm install --no-save playwright@1.49.1 >/dev/null
          else
            npm install --no-save playwright@1.49.1 >/dev/null
            npx playwright install --with-deps chromium >/dev/null
          fi
          node ui-smoke.mjs "$EXAM_URL" shots
          ../ci/fsync-bench.sh

      - name: Memory and node sizes
        if: always()
        run: |
          { echo '## Memory (shared hosts of mock 1)'; echo '```'; $HOSTCTL mem
            for h in $(awk '!/^#/ && NF {print $1}' cka/mock-01/hosts.txt | head -2); do $HOSTCTL nodes "$h"; done; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY" || true
          cat /tmp/apt-watchdog.log 2>/dev/null || true

      - name: Collect logs
        if: always()
        run: |
          mkdir -p simulator/ci/shots
          sudo journalctl _UID=$(id -u candidate 2>/dev/null || echo 0) --no-pager > simulator/ci/shots/desktop-journal.txt 2>&1 || true
          sudo chown -R "$USER" simulator/ci/shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-shots
          path: simulator/ci/shots
